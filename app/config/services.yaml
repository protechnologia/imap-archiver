# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Typy nie-usługowe (czyste dane / mapowanie ORM / statyczne helpery) nie mają być usługami.
        exclude: '../src/{Entity,Enum,Model,Util,Kernel.php}'

    # Klucz szyfrowania poświadczeń IMAP; public, bo pobiera go Kernel::boot()
    # do wstrzyknięcia w EncryptedStringType (typ Doctrine bez własnego DI).
    App\Security\CredentialEncryptor:
        arguments:
            $key: '%env(MAIL_CRYPTO_KEY)%'
        public: true

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true

        # ARCHIWUM TESTOWE OSOBNO OD PRAWDZIWEGO (etap 4.5).
        # `ARCHIVE_DIR` przyjeżdża z `compose.yaml` jako REAL ENV VAR, więc nie da się go przykryć
        # wpisem w `.env.test` — env var wygrywa z plikiem. Bez tego przykrycia każdy test idący
        # przez kontener (funkcjonalny podgląd treści) pisałby `.eml` do `/archive`, czyli do
        # bind mountu ze ŹRÓDŁEM PRAWDY, i zostawiał tam śmieci pod ID kont z bazy `app_test`.
        # Testy jednostkowe robią to inaczej — budują `ArchiveStorage` wprost na katalogu
        # tymczasowym (patrz `ArchiveStorageTest`, `ImportManagerTest`) — ale kontrolera tak
        # skonfigurować się nie da, bo usługę składa kontener.
        App\Service\ArchiveStorage:
            arguments:
                $archiveDir: '%kernel.project_dir%/var/test-archive'
